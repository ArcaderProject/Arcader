name: Build Debian Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build-deb:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - deb_arch: amd64
            rust_target: x86_64-unknown-linux-musl
          - deb_arch: i386
            rust_target: i686-unknown-linux-musl

    env:
      DEB_ARCH: ${{ matrix.deb_arch }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.rust_target }}

    - name: Install zig
      uses: mlugg/setup-zig@v2

    - name: Install cargo-zigbuild
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-zigbuild

    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: latest

    - name: Setup Godot
      uses: chickensoft-games/setup-godot@v2
      with:
        version: 4.6.0
        use-dotnet: false
        include-templates: true

    - name: Install arduino-cli (coin acceptor firmware)
      uses: arduino/setup-arduino-cli@v2

    - name: Make scripts executable
      run: chmod +x scripts/*.sh

    - name: Build components
      run: ./scripts/build-components.sh

    - name: Setup package structure
      run: ./scripts/setup-package-structure.sh

    - name: Create system files
      run: ./scripts/create-system-files.sh

    - name: Create Debian control files
      run: ./scripts/create-debian-files.sh

    - name: Build .deb package
      run: ./scripts/build-deb.sh

    - name: Upload .deb package
      uses: actions/upload-artifact@v4
      with:
        name: arcader-deb-package-${{ matrix.deb_arch }}
        path: "*.deb"
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: "*.deb"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-apt-deploy:
    needs: build-deb
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/deploy-apt-repo.yml
    secrets: inherit